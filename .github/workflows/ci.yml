name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  verification:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            valgrind \
            gcc-arm-none-eabi \
            gcc-avr \
            avr-libc \
            python3 \
            perl \
            nodejs \
            ruby \
            php-cli \
            tcl

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run standard native test suite
        run: make test

      - name: Run Valgrind memory leak checks
        run: make test-valgrind

      - name: Run AddressSanitizer & UndefinedBehaviorSanitizer
        run: make test-asan

      - name: Run ThreadSanitizer
        run: |
          set +e
          make test-tsan > /tmp/tsan.txt 2>&1
          RC=$?
          cat /tmp/tsan.txt
          if [ $RC -ne 0 ]; then
            exit $RC
          fi

      - name: Push TSan log on failure
        if: failure()
        run: |
          if [ -f /tmp/tsan.txt ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git checkout -B debug-tsan
            cp /tmp/tsan.txt debug_tsan_output.txt
            git add debug_tsan_output.txt
            git commit -m "debug: tsan failure log"
            git push -f origin debug-tsan
          fi

      - name: Run cross-language protocol conformance
        run: make test-conformance

      - name: Run language adapter integration tests
        run: make test-adapters

      - name: Run scripting automation tests
        run: make test-scripts

      - name: Cross-compile embedded targets (Pico & AVR)
        run: |
          make pico
          make avr
