name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verification:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            valgrind \
            gcc-arm-none-eabi \
            gcc-avr \
            avr-libc \
            python3 \
            perl \
            nodejs \
            ruby \
            php-cli \
            tcl

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run standard native test suite
        run: make test

      - name: Run Valgrind memory leak checks
        run: make test-valgrind

      - name: Run AddressSanitizer & UndefinedBehaviorSanitizer
        run: make test-asan

      - name: Run ThreadSanitizer
        run: |
          set +e
          make test-tsan > tsan.log 2>&1
          RC=$?
          cat tsan.log
          if [ $RC -ne 0 ]; then
            echo "### ThreadSanitizer Failure" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 150 tsan.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $RC
          fi

      - name: Upload TSan log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tsan-log
          path: tsan.log

      - name: Run cross-language protocol conformance
        run: make test-conformance

      - name: Run language adapter integration tests
        run: make test-adapters

      - name: Run scripting automation tests
        run: make test-scripts

      - name: Cross-compile embedded targets (Pico & AVR)
        run: |
          make pico
          make avr
